name: Apply reviewed stateless signup
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stateless-import
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Apply reviewed source and remove this temporary workflow
        run: |
          python3 - <<'PY'
          import pathlib,base64,json,hashlib
          files=json.loads("{\"server/signup.js\": \"\", \"functions/api/subscribe.js\": \"\", \"functions/api/confirm.js\": \"\", \"test/signup.test.mjs\": \"\", \"README.md\": \"\", \".env.example\": \"IyBQdWJsaWMgYnVpbGQtdGltZSBrZXkgb25seS4gU2VjcmV0cyBtdXN0IGJlIHNldCBpbiBDbG91ZGZsYXJlIFBhZ2VzLCBub3QgaGVyZS4KUFVCTElDX1RVUk5TVElMRV9TSVRFX0tFWT0KIyBSdW50aW1lIGVuY3J5cHRlZCBzZWNyZXRzOiBQTFVOS19TRUNSRVRfS0VZLCBUVVJOU1RJTEVfU0VDUkVUX0tFWSwgQ09ORklSTV9UT0tFTl9TRUNSRVQK\"}")
          expected=json.loads("{\"server/signup.js\": \"3fd62311ef33f1e99193bf2cefad35c054060e62a97baeaaa61999cabc1e0eaf\", \"functions/api/subscribe.js\": \"1a3bb2917a67d6346694a80101a433154ab41fba3f61a5cf1ae7339ff5cf6c88\", \"functions/api/confirm.js\": \"3ea6e8347836d33f5e4d0c64fc7becb9ca267d0926b029dc310e273485b8bf29\", \"test/signup.test.mjs\": \"97550d4550865c0b6844f86f6a9bb4524d7b2259fc91acd9cf86ff76fe5c29cb\", \"README.md\": \"1c8869daa138ac4d73897bc86b4c5d28f77f61ae55c70a23efd38cb1a88cd395\", \".env.example\": \"d2b14e9e5c7731566b3db650ee1e64eddff2e0c0062e0e446a199214ad1e49f4\"}")
          for p,b64 in files.items():
           path=pathlib.Path(p)
           assert hashlib.sha256(path.read_bytes()).hexdigest()==expected[p], 'Concurrent edit: '+p
           path.write_bytes(base64.b64decode(b64))
          p=pathlib.Path('src/pages/privacy.astro')
          s=p.read_text()
          old='Plunk holds your email address, newsletter contact record and consent status and sends our emails. Cloudflare D1 also holds your email address, confirmation nonce and status, and request timestamp. This helps prevent repeated signup requests and reuse of confirmation links.'
          assert old in s, 'Privacy signup text changed'
          s=s.replace(old, 'Plunk holds your email address, newsletter contact record and consent status and sends our emails. Plunk is the only store of newsletter signup and confirmation state. We do not store newsletter email addresses in a Cloudflare database.')
          s=s.replace('<p>Stale signup records in Cloudflare D1 are removed after 30 days when the next signup is processed. This is not a scheduled deletion exactly 30 days after a request.</p>', '<p>Confirmation links are digitally signed and expire after 24 hours. They are not stored on the server and cannot be individually revoked or marked as used. While a link is valid, pressing Confirm can subscribe an existing contact again, even after an unsubscribe. A link cannot recreate a deleted contact.</p>')
          p.write_text(s)
          p=pathlib.Path('.github/workflows/apply-reviewed-build.yml')
          p.write_text(p.read_text().replace('Runtime secrets and SIGNUP_DB', 'Runtime secrets'))
          pathlib.Path('.github/workflows/apply-stateless.yml').unlink()
          PY
      - run: npm ci
      - run: node --test test/signup.test.mjs
      - run: npm run build
        env:
          PUBLIC_TURNSTILE_SITE_KEY: '0x4AAAAAAFQPE3WOVOyxOaBe'
      - name: Commit reviewed change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/signup.js functions/api/subscribe.js functions/api/confirm.js test/signup.test.mjs README.md .env.example src/pages/privacy.astro .github/workflows
          git commit -m 'Use Plunk-only newsletter state with signed expiring confirmation links'
          git push origin HEAD:main
