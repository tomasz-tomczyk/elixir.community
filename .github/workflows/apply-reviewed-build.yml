name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - run: node --test test/signup.test.mjs
      - run: npm run build
        env:
          PUBLIC_TURNSTILE_SITE_KEY: '0x4AAAAAAFQPE3WOVOyxOaBe'
# Cloudflare Pages' native GitHub integration automatically deploys main.
# Runtime secrets and SIGNUP_DB are configured in Cloudflare, not GitHub.
