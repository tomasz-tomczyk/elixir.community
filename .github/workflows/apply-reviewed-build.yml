name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # Installs Node and pnpm at the versions in mise.toml.
      - uses: jdx/mise-action@v5.1.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: node --test test/signup.test.mjs test/clicks.test.mjs
      - run: pnpm build
        env:
          PUBLIC_TURNSTILE_SITE_KEY: '0x4AAAAAAFQPE3WOVOyxOaBe'
# Cloudflare Pages' native GitHub integration automatically deploys main.
# Runtime secrets and SIGNUP_DB are configured in Cloudflare, not GitHub.
