name: Apply reviewed site build
on:
  push:
    branches: [main]
    paths: ['reviewed-site-build.b64']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Apply reviewed source archive
        run: |
          test -f reviewed-site-build.b64
          base64 -d reviewed-site-build.b64 | tar -xz
          if test -f .reviewed-deletions; then
            while IFS= read -r path; do
              case "$path" in src/*|public/*) rm -f -- "$path" ;; *) exit 1 ;; esac
            done < .reviewed-deletions
          fi
          rm -f reviewed-site-build.b64 .reviewed-deletions
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && node --test test/signup.test.mjs && npm run build
      - name: Commit checked build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build researched community site and secure newsletter signup"
          git push
