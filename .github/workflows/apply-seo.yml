name: Apply reviewed SEO fixes
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Apply reviewed files
        run: |
          python3 - <<'PYCODE'
          import json,gzip,base64,hashlib
          from pathlib import Path
          raw=gzip.decompress(base64.b64decode(''))
          assert hashlib.sha256(raw).hexdigest() == '68963af13efb1cc12045eeedf6d92852b62744c85854b4fe35c4aa87ca192a1b'
          for file,content in json.loads(raw).items():
              p=Path(file)
              assert not p.is_absolute() and '..' not in p.parts
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(base64.b64decode(content))
          PYCODE
      - run: npm ci
      - run: node --test test/signup.test.mjs
      - run: npm run build
        env:
          PUBLIC_TURNSTILE_SITE_KEY: '0x4AAAAAAFQPE3WOVOyxOaBe'
      - name: Commit reviewed dates and remove one-time importer
        run: |
          rm .github/workflows/apply-seo.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Fix technical SEO and social metadata'
          git push origin HEAD:main
