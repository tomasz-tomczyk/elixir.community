name: Apply reviewed content improvements
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Apply reviewed content only
        run: |
          python3 - <<'PYCODE'
          import json,gzip,base64,hashlib
          from pathlib import Path
          raw=gzip.decompress(base64.b64decode(''))
          assert hashlib.sha256(raw).hexdigest() == '1d37133b561a562facf70c279d36ca5a611e3311ec25df713ac5c2477c53c4cf'
          for file,content in json.loads(raw).items():
              p=Path(file)
              assert file.startswith(('src/content/companies/', 'src/data/')) or file in ['CONTENT-DATES.md','src/components/EntryDates.astro','src/content.config.ts','src/pages/people/[id].astro']
              assert not p.is_absolute() and '..' not in p.parts
              p.write_bytes(base64.b64decode(content))
          PYCODE
      - run: npm ci
      - run: node --test test/signup.test.mjs
      - run: npm run build
        env:
          PUBLIC_TURNSTILE_SITE_KEY: '0x4AAAAAAFQPE3WOVOyxOaBe'
      - name: Commit content and remove importer
        run: |
          rm .github/workflows/apply-content.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content/companies src/data/books.yaml src/data/people.yaml src/data/podcasts.yaml CONTENT-DATES.md src/components/EntryDates.astro src/content.config.ts 'src/pages/people/[id].astro' .github/workflows/apply-content.yml
          git commit -m 'Write sourced company and people profiles; verify edition dates'
          git pull --rebase origin main
          git push origin HEAD:main
